[project]
name = "dbtools"
version = "0.1.0"
description = "Reference server, benchmarks and end to end tests for deckbridge"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15",
    "pillow>=11",
    "zeroconf>=0.140",
    "cryptography>=44",
    "pyserial>=3.5",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["ota: restarts the bridge, slow"]
addopts = "-m 'not ota'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbtools"]

[tool.ruff.lint.per-file-ignores]
"dbtools/gen_font.py" = ["RUF001"]  # the glyph list is meant to hold typographic characters
