[project]
name = "dbtools"
version = "0.1.0"
description = "Reference server, benchmarks and end to end tests for deckbridge"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15",
    "pillow>=11",
    "zeroconf>=0.140",
    "cryptography>=44",
    "pyserial>=3.5",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "playwright>=1.50",
    "zxing-cpp>=3.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "ota: restarts the bridge, slow",
    "unifi: changes the switch config",
    "boot: cuts the power through the serial bridge, slow",
    "bootwrite: rewrites the bootloader and partition table with what is already there (USB needed if power fails)",
    "sim: needs only the API, so it also runs on firmware/sim (--target sim)",
]
addopts = "-m 'not ota and not unifi and not boot and not bootwrite'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dbtools"]

[tool.ruff.lint.per-file-ignores]
"dbtools/gen_font.py" = ["RUF001"]  # the glyph list is meant to hold typographic characters
