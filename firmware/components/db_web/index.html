<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deckbridge</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1b1f24;--dim:#5d6670;--line:#d9dde2;--accent:#2563eb;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--text:#e8ebef;--dim:#9aa4ae;--line:#2a3038;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:900px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 16px}h2{font-size:16px;margin:0 0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.kv div{color:var(--dim);font-size:13px}.kv b{display:block;font-weight:600;word-break:break-all}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.plain{background:transparent;color:var(--text);border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}#msg{min-height:1.4em}
pre{max-height:320px;overflow:auto;font-size:12px;background:var(--bg);padding:10px;border-radius:6px;white-space:pre-wrap}
fieldset{border:0;padding:0;margin:0}.static{display:none}.fixed .static{display:block}
.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ctrl button{background:transparent;color:var(--text);border:1px solid var(--line);text-align:left;padding:10px 12px}
.ctrl button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ctrl small{display:block;font-size:12px;color:var(--dim)}
#deck{position:relative;width:100%;background:#000;border-radius:8px;overflow:hidden;touch-action:none;user-select:none}
#deck img,.hit{position:absolute}.hit{cursor:pointer;border-radius:6px}.hit:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.hit.down{background:rgba(255,255,255,.25)}
#encs{display:grid;gap:8px;margin-top:8px}.enc{display:flex;gap:4px;justify-content:center;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px}
.enc button{padding:6px 10px}.enc .knob{border-radius:50%;width:44px;height:44px;padding:0}
@media (max-width:560px){.ctrl{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<form id="login" hidden>
<h1>deckbridge</h1>
<section>
<h2>Anmelden</h2>
<label for="pw">Passwort für admin (auf dem Deck unter Menü, Info)</label>
<input id="pw" type="password" autocomplete="current-password" autofocus>
<div class="row"><button>Anmelden</button><span id="loginmsg" class="bad"></span></div>
</section>
</form>
<div id="app" hidden>
<div class="row" style="justify-content:space-between;margin:4px 0 16px"><h1 id="title" style="margin:0">deckbridge</h1><button id="logout" class="plain">Abmelden</button></div>

<section>
<h2>Gesteuert von</h2>
<div class="ctrl" id="ctrl"></div>
<div id="deck"><div id="pics"></div><div id="hits"></div></div>
<div id="encs"></div>
<p id="writer" class="dim" style="margin:8px 0 0"></p>
</section>

<section>
<h2>Status</h2>
<div class="grid kv" id="status"></div>
</section>

<section>
<h2>Einstellungen</h2>
<form id="cfg">
<div class="grid">
<div><label for="name">Name</label><input id="name" maxlength="31"></div>
<div><label for="brightness">Helligkeit</label><input id="brightness" type="range" min="0" max="100"></div>
</div>
<h2 style="margin-top:18px">Eigene Server</h2>
<div class="grid">
<div><label for="s0">Server 1</label><input id="s0" placeholder="leer: im Netz suchen" maxlength="95"></div>
<div><label for="s1">Server 2, übernimmt bei Ausfall</label><input id="s1" placeholder="ws://host:8765/deckbridge" maxlength="95"></div>
<div><label for="token">Token</label><input id="token" type="password" placeholder="unverändert" maxlength="47"></div>
</div>
<h2 style="margin-top:18px">WLAN</h2>
<div class="grid">
<div><label for="ssid">Netz, nur 2,4 GHz</label><input id="ssid" maxlength="32"></div>
<div><label for="wpass">Passwort</label><input id="wpass" type="password" placeholder="unverändert" maxlength="64"></div>
</div>
<div class="grid" style="margin-top:18px">
<fieldset id="lan"><h2>LAN-Adresse</h2></fieldset>
<fieldset id="wlan"><h2>WLAN-Adresse</h2></fieldset>
</div>
<h2 style="margin-top:18px">Web-Zugang</h2>
<div class="grid"><div><label for="apass">Neues Passwort für admin</label><input id="apass" type="password" placeholder="unverändert" minlength="6" maxlength="23"></div></div>
<div class="row"><button>Speichern</button><span id="msg"></span></div>
</form>
</section>

<section>
<h2>Update</h2>
<p style="margin-top:0" class="dim">Signierte .dbfw-Datei für die Bridge oder den WLAN-Chip. Die Datei sagt selbst, wofür sie ist.</p>
<div class="row"><input id="fw" type="file" accept=".dbfw" style="max-width:360px"><button id="up" class="plain">Hochladen</button><span id="upmsg"></span></div>
</section>

<section>
<h2>Protokoll</h2>
<div class="row" style="margin-top:0"><button id="logbtn" class="plain">Aktualisieren</button><button id="reboot" class="plain">Neu starten</button></div>
<pre id="log"></pre>
</section>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
/* Every request carries this header; the bridge refuses changes without it, so other sites cannot send them. */
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'X-Deckbridge': '1', ...(opts.headers || {})}});
  if (r.status === 401 && path !== '/api/status' && path !== '/api/login') location.reload(); /* session ended */
  return r;
}
const send = async (path, body) => {
  const r = await api(path, {method: 'PUT', body: JSON.stringify(body)}).catch(() => null);
  const j = r ? await r.json().catch(() => ({ok: false, error: 'HTTP ' + r.status})) : {ok: false, error: 'Bridge nicht erreichbar'};
  if (!j.ok) $('writer').textContent = 'Fehler: ' + j.error;
  return j;
};
const ipFields = ['ip', 'mask', 'gateway', 'dns'];
const ipNames = {ip: 'Adresse', mask: 'Maske', gateway: 'Gateway', dns: 'DNS'};
const controllers = {server: 'Eigene Server', app: 'Stream Deck App', companion: 'Companion'};
const writers = {ui: 'die Bridge selbst (Status oder Menü)', server1: 'Server 1', server2: 'Server 2', app: 'die Stream Deck App', companion: 'Companion'};

function ipForm(box, key) {
  box.insertAdjacentHTML('beforeend', `<label><input type="checkbox" id="${key}_dhcp" style="width:auto"> DHCP</label>` +
    ipFields.map((f) => `<div class="static"><label for="${key}_${f}">${ipNames[f]}</label><input id="${key}_${f}"></div>`).join(''));
  $(key + '_dhcp').onchange = () => box.classList.toggle('fixed', !$(key + '_dhcp').checked);
}
ipForm($('lan'), 'lan');
ipForm($('wlan'), 'wlan');

const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function kv(label, value, cls) {
  return `<div>${label}<b class="${cls || ''}">${esc(value ?? '–')}</b></div>`;
}

function readiness(s, key) {
  if (key === 'server') {
    const n = s.servers.filter((x) => x.connected).length;
    return n ? `${n} verbunden` : 'nicht verbunden';
  }
  const h = s.dock_hosts.find((x) => x.kind === key);
  return h ? (h.device ? 'verbunden, ' + h.ip : 'sieht das Dock, ' + h.ip) : 'nicht verbunden';
}

function renderControllers(s) {
  $('ctrl').innerHTML = Object.entries(controllers).map(([key, name]) =>
    `<button type="button" data-c="${key}" aria-pressed="${s.controller === key}">${name}<small>${readiness(s, key)}</small></button>`).join('');
  for (const b of $('ctrl').querySelectorAll('button')) {
    b.onclick = async () => {
      if ((await send('/api/config', {controller: b.dataset.c})).ok) refresh();
    };
  }
}

let shown = '';
let layout = '';
/* one at a time, so an up never overtakes its down */
let inputs = Promise.resolve();
const input = (body) => (inputs = inputs.then(() => api('/api/input', {method: 'POST', body: JSON.stringify(body)})).catch(() => null));

function holdable(el, body) {
  let held = false;
  el.onpointerdown = (e) => { if (e.button) return; held = true; el.setPointerCapture(e.pointerId); el.classList.add('down'); input({...body, action: 'down'}); };
  el.onpointerup = el.onpointercancel = () => { if (!held) return; held = false; el.classList.remove('down'); input({...body, action: 'up'}); };
}

const wheelAcc = {};
function wheel(el, encoderAt) {
  el.onwheel = (e) => {
    e.preventDefault();
    const encoder = encoderAt(e);
    /* a mouse wheel notch is one detent; a trackpad's small steps add up to one */
    const big = Math.abs(e.deltaY) >= 50;
    wheelAcc[encoder] = big ? 0 : (wheelAcc[encoder] || 0) + e.deltaY;
    const steps = big ? Math.sign(e.deltaY) : Math.trunc(wheelAcc[encoder] / 50);
    if (!steps) return;
    if (!big) wheelAcc[encoder] -= steps * 50;
    input({encoder, action: 'turn', ticks: -steps}); /* wheel up turns right */
  };
}

const place = (r, sc) => {
  const pct = (v, total) => (100 * v / total) + '%';
  return `left:${pct(r.x, sc.width)};top:${pct(r.y, sc.height)};width:${pct(r.w, sc.width)};height:${pct(r.h, sc.height)}`;
};

function buildControls(sc) {
  $('hits').innerHTML = sc.keys.map((r, i) => `<div class="hit" data-k="${i}" title="Taste ${i + 1}" style="${place(r, sc)}"></div>`).join('') +
    sc.touch.map((r, i) => `<div class="hit" data-t="${i}" title="Streifen: tippen, lang drücken, wischen, Mausrad" style="${place(r, sc)}"></div>`).join('');
  for (const el of $('hits').querySelectorAll('[data-k]')) holdable(el, {key: +el.dataset.k});
  for (const el of $('hits').querySelectorAll('[data-t]')) {
    const r = sc.touch[+el.dataset.t];
    const at = (e) => {
      const b = el.getBoundingClientRect();
      const clamp = (v, lo, len) => Math.max(lo, Math.min(lo + len - 1, Math.floor(v)));
      return {x: clamp(r.x + (e.clientX - b.left) / b.width * r.w, r.x, r.w), y: clamp(r.y + (e.clientY - b.top) / b.height * r.h, r.y, r.h)};
    };
    let start = null;
    el.onpointerdown = (e) => { if (e.button) return; el.setPointerCapture(e.pointerId); start = {...at(e), t: Date.now()}; };
    el.onpointerup = (e) => {
      if (!start) return;
      const end = at(e);
      if (Math.abs(end.x - start.x) > 20) input({touch: 'swipe', x: start.x, y: start.y, x2: end.x, y2: end.y});
      else input({touch: Date.now() - start.t > 500 ? 'long' : 'tap', x: start.x, y: start.y});
      start = null;
    };
    if (sc.encoders) wheel(el, (e) => Math.min(sc.encoders - 1, Math.floor((at(e).x - r.x) / r.w * sc.encoders)));
  }
  $('encs').style.gridTemplateColumns = `repeat(${sc.encoders || 1}, 1fr)`;
  $('encs').innerHTML = Array.from({length: sc.encoders}, (_, i) =>
    `<div class="enc" data-e="${i}" title="Regler ${i + 1}: Mausrad dreht"><button class="plain" data-turn="-1">⟲</button><button class="plain knob" title="drücken">${i + 1}</button><button class="plain" data-turn="1">⟳</button></div>`).join('');
  for (const el of $('encs').querySelectorAll('.enc')) {
    const encoder = +el.dataset.e;
    holdable(el.querySelector('.knob'), {encoder});
    for (const b of el.querySelectorAll('[data-turn]')) b.onclick = () => input({encoder, action: 'turn', ticks: +b.dataset.turn});
    wheel(el, () => encoder);
  }
}
async function loadScreen() {
  const r = await api('/api/screen').catch(() => null);
  if (!r || !r.ok) {
    $('writer').textContent = 'Die Bridge antwortet nicht.';
    return;
  }
  const sc = await r.json();
  $('writer').textContent = sc.width ? 'Auf dem Deck zeichnet gerade ' + (writers[sc.writer] || sc.writer) + '.' : 'Kein Stream Deck angeschlossen.';
  const geometry = JSON.stringify([sc.width, sc.keys, sc.touch, sc.encoders]);
  if (geometry !== layout) {
    layout = geometry;
    $('deck').style.aspectRatio = sc.width ? `${sc.width} / ${sc.height}` : '';
    if (sc.width) buildControls(sc); else $('hits').innerHTML = $('encs').innerHTML = '';
  }
  const key = sc.images.map((i) => i.url).join();
  if (key === shown) return;
  shown = key;
  $('pics').innerHTML = sc.images.map((i) => `<img src="${i.url}" alt="" onerror="shown=''" style="${place(i, sc)}">`).join('');
}

async function loadStatus() {
  const r = await api('/api/status').catch(() => null);
  if (!r || !r.ok) return;
  const s = await r.json();
  $('title').textContent = s.name;
  renderControllers(s);
  const n = s.network;
  const srv = s.servers.map((x, i) => kv('Server ' + (i + 1), x.url ? (x.connected ? (x.active ? 'aktiv' : 'bereit') : 'getrennt') + ' · ' + x.url : '–', x.connected ? 'ok' : '')).join('');
  $('status').innerHTML = kv('Gerät', s.device ? `${s.device.model} (${s.device.serial})` : 'nicht angeschlossen', s.device ? 'ok' : 'bad') +
    kv('LAN', n.lan.ip || (n.lan.cable ? 'keine Adresse' : 'kein Kabel'), n.lan.ip ? 'ok' : '') +
    kv('WLAN', n.wlan.ip ? `${n.wlan.ip} · ${n.wlan.rssi} dBm` : (n.wlan.ssid ? 'getrennt' : 'aus'), n.wlan.ip ? 'ok' : '') +
    srv + kv('Firmware', s.firmware) + kv('WLAN-Chip', s.wlan_firmware) + kv('Laufzeit', Math.round(s.uptime_s / 60) + ' min') +
    kv('Speicher frei', `${Math.round(s.memory.heap_free / 1024)} KB intern, ${Math.round(s.memory.psram_free / 1048576)} MB PSRAM`) +
    kv('Bilder', `${s.counters.images} gezeigt, ${s.counters.superseded} übersprungen, ${s.counters.usb_errors} USB-Fehler`);
}

function refresh() {
  loadStatus();
  loadScreen();
}

async function loadConfig() {
  const c = await (await api('/api/config')).json();
  $('name').value = c.name; $('brightness').value = c.brightness;
  $('s0').value = c.servers[0] || ''; $('s1').value = c.servers[1] || ''; $('ssid').value = c.wifi_ssid;
  for (const key of ['lan', 'wlan']) {
    $(key + '_dhcp').checked = c[key].dhcp;
    $(key).classList.toggle('fixed', !c[key].dhcp);
    for (const f of ipFields) $(key + '_' + f).value = c[key][f];
  }
}

$('brightness').onchange = () => send('/api/config', {brightness: +$('brightness').value});

$('cfg').onsubmit = async (e) => {
  e.preventDefault();
  const ip = (key) => Object.fromEntries([['dhcp', $(key + '_dhcp').checked], ...ipFields.map((f) => [f, $(key + '_' + f).value])]);
  const body = {name: $('name').value, brightness: +$('brightness').value,
    servers: [$('s0').value, $('s1').value].filter(Boolean), wifi_ssid: $('ssid').value, lan: ip('lan'), wlan: ip('wlan')};
  for (const [id, key] of [['wpass', 'wifi_pass'], ['token', 'token'], ['apass', 'admin_pass']]) if ($(id).value) body[key] = $(id).value;
  const r = await (await api('/api/config', {method: 'PUT', body: JSON.stringify(body)})).json();
  $('msg').className = r.ok ? 'ok' : 'bad';
  $('msg').textContent = r.ok ? (r.restart ? 'Gespeichert. Die Bridge startet neu.' : 'Gespeichert.') : r.error;
};

$('up').onclick = async () => {
  const file = $('fw').files[0];
  if (!file) return;
  $('upmsg').className = ''; $('upmsg').textContent = 'Lade hoch …';
  const r = await (await api('/api/ota', {method: 'POST', body: file})).json().catch(() => ({ok: false, error: 'Verbindung verloren'}));
  $('upmsg').className = r.ok ? 'ok' : 'bad';
  $('upmsg').textContent = r.ok ? 'Installiert. Die Bridge startet neu.' : 'Fehler: ' + r.error;
};

$('logbtn').onclick = async () => { $('log').textContent = await (await api('/api/log')).text(); $('log').scrollTop = 1e9; };
$('reboot').onclick = () => api('/api/reboot', {method: 'POST'});

async function start() {
  const r = await api('/api/status');
  if (r.status === 401) {
    $('login').hidden = false;
    $('app').hidden = true;
    return;
  }
  $('login').hidden = true;
  $('app').hidden = false;
  loadConfig();
  refresh();
  setInterval(loadScreen, 1000);
  setInterval(loadStatus, 5000);
}

$('login').onsubmit = async (e) => {
  e.preventDefault();
  const r = await api('/api/login', {method: 'POST', body: JSON.stringify({password: $('pw').value})});
  const j = await r.json();
  if (j.ok) return start();
  $('loginmsg').textContent = j.error === 'locked' ? `Zu viele Versuche. Bitte ${j.retry} s warten.` : 'Falsches Passwort.';
};
$('logout').onclick = async () => { await api('/api/logout', {method: 'POST'}); location.reload(); };

start();
</script>
</body>
</html>
