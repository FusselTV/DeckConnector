name: home-assistant
on:
  push:
    branches: [main]
    paths: [custom_components/**, tools/ha/**, hacs.json, firmware/**, web/**, .github/scripts/idf.*, .github/workflows/ha.yml]
  pull_request:
    paths: [custom_components/**, tools/ha/**, hacs.json, firmware/**, web/**, .github/scripts/idf.*, .github/workflows/ha.yml]
  schedule:
    - cron: '0 4 * * 1' # hassfest and HACS change their checks without this repo changing
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67

concurrency:
  group: ha-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-26

  hacs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # HACS reads hacs.json and the manifest from raw.githubusercontent.com without a token, which 404s while the
      # repository is private. A scheduled run has no github.event.repository, so ask the API.
      - id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      - if: steps.repo.outputs.private == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.repo.outputs.private == 'false'
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          category: integration

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - working-directory: tools/ha
        run: |
          uvx ruff@0.17.5 check --config pyproject.toml ../../custom_components . && uvx ruff@0.17.5 format --config pyproject.toml --check ../../custom_components .
          uv run --locked mypy ../../custom_components/deckconnector
          uv run --locked pytest --cov=custom_components.deckconnector --cov-report=term-missing --cov-fail-under=95

  # A real Home Assistant in Docker against firmware/sim and firmware/simdeck
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: |
          (cd web && npm ci && npx vite build) # the simulators embed the page from web/dist
          .github/scripts/idf.sh 'idf.py -C firmware/sim build && idf.py -C firmware/simdeck build'
      - working-directory: tools/ha
        run: uv run --locked pytest e2e -p no:homeassistant
