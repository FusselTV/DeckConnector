name: site
on:
  push:
    branches: [main]
    paths: [site/**, web/**, THIRD_PARTY_LICENSES.txt, firmware/components/db_ui/**, firmware/components/db_core/**, firmware/host_test/**, .github/scripts/**, .github/workflows/site.yml]
  release:
    types: [published]
  pull_request:
    paths: [site/**, web/**, THIRD_PARTY_LICENSES.txt, firmware/components/db_ui/**, firmware/components/db_core/**, firmware/host_test/**, .github/scripts/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # also reads the release assets of this repo
    outputs:
      screens: ${{ steps.screens.outputs.md }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # a deploy builds from a clean slate
          cache: ${{ github.event_name == 'pull_request' && 'npm' || '' }}
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      # The deck screens the host test draws, main against the PR. They build in the background while the web
      # page builds; the changed ones go into the preview.
      - if: github.event_name == 'pull_request'
        run: |
          for side in base pr; do
            src=.; [ $side = base ] && src=.base
            b="$RUNNER_TEMP/ui-$side"
            (cmake -S "$src/firmware/host_test" -B "$b" > /dev/null && cmake --build "$b" --target test_ui -j2 > /dev/null \
              && cd "$b" && ./test_ui > /dev/null; echo $? > "$b.status") > /dev/null 2>&1 < /dev/null &
          done
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ github.event_name == 'pull_request' }}
      - run: cd web && npm ci && npm run build && npm run build:demo
      - if: github.event_name == 'pull_request'
        id: screens
        timeout-minutes: 3
        run: |
          for side in base pr; do
            until test -s "$RUNNER_TEMP/ui-$side.status"; do sleep 1; done
            [ "$(cat "$RUNNER_TEMP/ui-$side.status")" = 0 ] || echo "::warning::the deck screens of $side were not drawn"
          done
          {
            echo 'md<<SCREENS_EOF'
            node .github/scripts/screen-diff.mjs "$RUNNER_TEMP/ui-base/ui" "$RUNNER_TEMP/ui-pr/ui" site/public/pr-screens
            echo SCREENS_EOF
          } >> "$GITHUB_OUTPUT"
          rm -rf .base
      # site's search test drives web's Playwright
      - run: cd web && npx playwright install --with-deps --only-shell chromium
      # Release assets send no CORS headers, so the flasher gets its copy from the site.
      - name: Firmware of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=site/public/firmware
          if gh release view --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release download --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern manifest.json --pattern '*.bin' --pattern SHA256SUMS --pattern THIRD_PARTY_LICENSES.txt
            (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS && rm SHA256SUMS)
          else
            echo "::warning::no release to take the firmware from, the flasher has no files"
          fi
      - run: cd site && npm ci && npm run check
        env:
          # a deploy outside a pull request must not publish an imprint with TODO in it
          LEGAL_STRICT: ${{ github.event_name != 'pull_request' && '1' || '' }}
          OWNER_NAME: ${{ secrets.OWNER_NAME }}
          OWNER_STREET: ${{ secrets.OWNER_STREET }}
          OWNER_CITY: ${{ secrets.OWNER_CITY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_AUTHORITY_NAME: ${{ secrets.OWNER_AUTHORITY_NAME }}
          OWNER_AUTHORITY_URL: ${{ secrets.OWNER_AUTHORITY_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/out/
          if-no-files-found: error

  lighthouse:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # the checkout needs it in a private repository
      actions: read # the Lighthouse reports of main
    outputs:
      report: ${{ steps.scores.outputs.md }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            site/lighthouserc.json
            .github/scripts/lighthouse-report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      # Budgets and minimum scores live in site/lighthouserc.json.
      - id: lighthouse
        run: cd site && npx -y @lhci/cli@0.16.0 autorun
      - name: Scores
        id: scores
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHTHOUSE: ${{ steps.lighthouse.outcome }}
        run: |
          main=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow site.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -z "$main" ] || gh run download "$main" --repo "$GITHUB_REPOSITORY" --name lighthouse --dir main || true
          {
            if [ "$LIGHTHOUSE" = success ]; then echo '### Lighthouse: within the budgets'
            else echo '### Lighthouse: outside the budgets, see the job log'; fi
            echo
            node .github/scripts/lighthouse-report.mjs site/.lighthouseci/reports main
            echo
            echo "Phone, median of 3 runs. Limits: \`site/lighthouserc.json\`. Reports: [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          { echo 'md<<REPORT_EOF'; cat report.md; echo REPORT_EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lighthouse
          path: site/.lighthouseci/reports/

  deploy:
    needs: build
    # no secrets for pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: cloudflare-pages
    permissions: {}
    outputs:
      url: ${{ steps.pages.outputs.deployment-url }}
      alias: ${{ steps.pages.outputs.pages-deployment-alias-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets are not set, nothing deployed"
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        id: branch
        env:
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        # Pages treats its production branch as production, any other name as a preview.
        run: |
          if [ -n "$PR" ]; then echo "name=pr-$PR"
          elif [ "$EVENT" = release ]; then echo "name=$DEFAULT"
          else echo "name=$GITHUB_REF_NAME"; fi >> "$GITHUB_OUTPUT"
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        id: pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.160.0
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'deckconnector' }} --branch=${{ steps.branch.outputs.name }}

  # The contact form's backend (site/contact-worker), from main only: a PR preview has no form backend.
  contact-worker:
    needs: build # the Worker's tests run there
    # Not on a release: its ref is the tag, which can be older than main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: cloudflare-pages
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_TO: ${{ secrets.OWNER_CONTACT_TO }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.CONTACT_TO == ''
        run: echo "::notice::Cloudflare secrets or OWNER_CONTACT_TO are not set, the contact form backend is not deployed"
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CONTACT_TO != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site/contact-worker
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CONTACT_TO != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.160.0
          workingDirectory: site/contact-worker
          command: deploy
          secrets: CONTACT_TO

  # One comment per PR, updated on every push. Forks get a read-only token, so they have the run summaries only.
  comment:
    needs: [build, lighthouse, deploy]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      URL: ${{ needs.deploy.outputs.url }}
      ALIAS: ${{ needs.deploy.outputs.alias || needs.deploy.outputs.url }}
      SCREENS: ${{ needs.build.outputs.screens }}
      LIGHTHOUSE: ${{ needs.lighthouse.outputs.report }}
    steps:
      - run: |
          {
            if [ -n "$URL" ]; then
              echo "**Preview:** [site]($ALIAS/) · [demo]($ALIAS/demo/) · [flasher]($ALIAS/flash/)"
              echo
              echo "${SCREENS//\{\{preview\}\}/$URL/pr-screens}"
            else
              echo '**Preview:** not deployed'
              echo
              echo "$SCREENS" | grep -v '^!\['
            fi
            echo
            echo "$LIGHTHOUSE"
          } > body.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md --edit-last --create-if-none
