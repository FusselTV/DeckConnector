name: site
on:
  push:
    branches: [main]
    paths: [site/**, web/**, .github/workflows/site.yml]
  release:
    types: [published]
  pull_request:
    paths: [site/**, web/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    permissions:
      contents: read # also reads the release assets of this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # a deploy builds from a clean slate
      - run: cd web && npm ci && npm run build:demo
      # Release assets send no CORS headers, so the flasher gets its copy from the site.
      - name: Firmware of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=site/public/firmware
          if gh release view --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release download --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern manifest.json --pattern '*.bin' --pattern SHA256SUMS
            (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS && rm SHA256SUMS)
          else
            echo "::warning::no release to take the firmware from, the flasher has no files"
          fi
      - run: cd site && npm ci && npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/out/
          if-no-files-found: error

  deploy:
    needs: build
    # no secrets for pull requests from forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: cloudflare-pages
    permissions: {}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::Cloudflare secrets are not set, nothing deployed"
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        id: branch
        env:
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        # Pages treats its production branch as production, any other name as a preview.
        run: |
          if [ -n "$PR" ]; then echo "name=pr-$PR"
          elif [ "$EVENT" = release ]; then echo "name=$DEFAULT"
          else echo "name=$GITHUB_REF_NAME"; fi >> "$GITHUB_OUTPUT"
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.158.0
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'deckconnector' }} --branch=${{ steps.branch.outputs.name }}
