name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # paths-filter lists the files of a pull request
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      host: ${{ steps.filter.outputs.host }}
      lint: ${{ steps.filter.outputs.lint }}
      sim: ${{ steps.filter.outputs.sim }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # Pushes, tags and manual runs build everything; only pull requests skip by path.
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            firmware: [firmware/**, web/**, tools/dbtools/flashimage.py, .github/scripts/idf.*, .github/scripts/tidy-firmware.sh, .github/scripts/linked-libs.*, .github/workflows/ci.yml]
            host: [firmware/host_test/**, firmware/components/**, .github/workflows/ci.yml]
            lint: [tools/**, firmware/**, .github/**]
            sim: [firmware/**, web/**, tools/dbtools/**, tools/tests/**, tools/simdeck/**, tools/simnet/**, tools/companion-check/**, tools/pyproject.toml, tools/uv.lock, .github/scripts/idf.*, .github/scripts/netns.sh, .github/workflows/ci.yml]
            web: [web/**, .github/workflows/ci.yml]

  host-tests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S firmware/host_test -B build-host -G Ninja && cmake --build build-host
      - run: ctest --test-dir build-host --output-on-failure

  lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # every workflow, with shellcheck on its run: blocks
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - run: cd tools && uvx ruff@0.17.5 check . && uvx ruff@0.17.5 format --check . && uv run --locked mypy
      - run: git ls-files 'firmware/components/db_*/*.c' 'firmware/components/db_*/*.h' 'firmware/components/db_*/include/*.h' 'firmware/main/*.c' 'firmware/components/db_core/drivers/*.c' 'firmware/host_test/*.c' 'firmware/components/db_*/*.cpp' | grep -v font_data.c | xargs pipx run clang-format==23.1.5 --dry-run --Werror
      - run: cmake -S firmware/host_test -B build-host -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: pipx run clang-tidy==23.1.4 -p build-host firmware/components/db_core/*.c firmware/components/db_core/drivers/*.c

  web:
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # release.yml appends licenses.md to THIRD_PARTY_LICENSES.txt
      - run: cd web && npm ci && npm run check && test -s dist/licenses.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-page
          path: |
            web/dist/index.html
            web/dist/licenses.md
          if-no-files-found: error

  # The website's demo, clicked through on a desktop and a phone screen. The contract project compares its mock with
  # the firmware simulator.
  demo:
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        project: [desktop, phone, contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: cd web && npm ci && npx playwright install chromium && npm run build:demo
      - if: matrix.project == 'contract'
        run: |
          (cd web && npx vite build) # the simulator embeds the page from web/dist
          .github/scripts/idf.sh 'idf.py -C firmware/simdeck build'
      - run: |
          [ "${{ matrix.project }}" = contract ] || export DC_NO_SIM=1
          cd web && npx playwright test -c playwright.demo.config.ts --project "${{ matrix.project }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-traces-${{ matrix.project }}
          path: web/test-results
          retention-days: 7

  sim-tests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.sim == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # a login in this suite fails now and then for a reason not found yet (#126): the failed tests run once more
          - suite: api
            sim: sim
            run: cd tools && uv run --locked pytest tests --target sim -n 4 || uv run --locked pytest --lf tests --target sim -n 4
          - suite: web-desktop
            sim: sim
            run: cd web && npx playwright test --project desktop
          - suite: web-phone
            sim: sim
            run: cd web && npx playwright test --project phone
          # a simdeck start hangs about once in 500 under load (#89): the failed tests run once more
          - suite: decks
            sim: simdeck
            run: cd tools && uv run --locked pytest simdeck --ignore simdeck/test_hosts.py || uv run --locked pytest --lf simdeck --ignore simdeck/test_hosts.py
          - suite: hosts
            sim: simdeck sim
            run: >-
              cd tools && (uv run --locked pytest simdeck/test_hosts.py || uv run --locked pytest --lf simdeck/test_hosts.py)
              && uv run --locked pytest simnet
    name: sim-tests (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe sets the firmware version, which test_update_check reads
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # Ubuntu's AppArmor blocks the unprivileged namespaces netns.sh and simnet make
      - run: sudo sysctl -qw kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          (cd web && npm ci && npx vite build) # the simulator embeds the page from web/dist
          # the OTA tests sign with a key made for this job; the simulator gets its public key
          echo "DBFW_KEY=$RUNNER_TEMP/ota_key.pem" >> "$GITHUB_ENV"
          (cd tools && uv sync --locked && DBFW_KEY=$RUNNER_TEMP/ota_key.pem uv run --locked python -m dbtools.dbfw keygen)
          .github/scripts/idf.sh "for s in ${{ matrix.sim }}; do idf.py -C firmware/\$s build; done"
          case ${{ matrix.suite }} in
            # tests that write flash images use IDF's partition table and NVS generators (0.1.9 is in IDF_IMAGE)
            api)
              mkdir -p "$RUNNER_TEMP/idf"
              docker run --rm --entrypoint tar "$IDF_IMAGE" c -C /opt/esp/idf components/partition_table | tar x -C "$RUNNER_TEMP/idf"
              uv venv -q "$RUNNER_TEMP/idfpy" && uv pip install -q -p "$RUNNER_TEMP/idfpy" esp-idf-nvs-partition-gen==0.1.9
              printf 'IDF_PATH=%s/idf\nIDF_PYTHON_ENV_PATH=%s/idfpy\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV" ;;
            web-*) cd web && npx playwright install chromium ;;
            decks | hosts) cd tools/companion-check && npm ci ;;
          esac
      - run: .github/scripts/netns.sh sh -c "${{ matrix.run }}"
        env:
          TMPDIR: ${{ runner.temp }} # web/scripts/sim.mjs copies the simulator to $TMPDIR, named by its fixed port
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-tests-${{ matrix.suite }}
          path: |
            web/test-results
            ~/.cache/simdeck/tests/*/sim.log
            ~/.cache/simnet/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Builds its own copy of the web page, so it runs beside the web job. The ESP-IDF image (about 10 GB unpacked)
  # comes down in the background while the page builds.
  firmware:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - run: |
          (docker image inspect "$IDF_IMAGE" >/dev/null 2>&1 || docker pull -q "$IDF_IMAGE"; echo $? > "$RUNNER_TEMP/pull-status") > "$RUNNER_TEMP/pull.log" 2>&1 < /dev/null &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe sets the firmware version
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: cd web && npm ci && npx vite build
      - name: Wait for the ESP-IDF image
        timeout-minutes: 8
        run: |
          until test -s "$RUNNER_TEMP/pull-status"; do sleep 1; done
          cat "$RUNNER_TEMP/pull.log"
          exit "$(cat "$RUNNER_TEMP/pull-status")"
      # a release builds from a clean slate
      - if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-firmware-${{ github.sha }}
          restore-keys: ccache-firmware-
      - name: Build
        run: IDF_MOUNT=/w .github/scripts/idf.sh 'idf.py -C firmware build && cd tools && python -m dbtools.flashimage'
      - run: .github/scripts/linked-libs.sh
      - name: clang-tidy
        run: |
          IDF_MOUNT=/w .github/scripts/idf.sh "python -m venv /tmp/tidy && /tmp/tidy/bin/pip install -q clang-tidy==23.1.4
            PATH=/tmp/tidy/bin:\$PATH .github/scripts/tidy-firmware.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deckconnector
          path: firmware/build/deckconnector.bin
          if-no-files-found: error
      # goes into the release: a coredump from the field decodes only with the ELF of the same build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elf
          path: firmware/build/deckconnector.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flasher
          path: firmware/build/web-flash/
          if-no-files-found: error

  # A PR may grow the web page or the firmware by 1 % at most, or it needs the label
  # size-increase (then re-run this job).
  sizes:
    needs: [web, firmware]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the artifacts of main
      pull-requests: read # the label
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{web-page,deckconnector}'
          path: pr
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          main=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          for a in web-page deckconnector; do
            [ -z "$main" ] || gh run download "$main" --repo "$GITHUB_REPOSITORY" --name "$a" --dir "main/$a" || true
          done
          size() {
            f=$(find "$1" -name "$2" 2> /dev/null | head -1)
            [ -z "$f" ] || case $2 in *.html) gzip -9c "$f" | wc -c ;; *) stat -c %s "$f" ;; esac
          }
          allowed=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "size-increase")')
          over=
          {
            echo '| File | main | PR | Change |'
            echo '|---|---|---|---|'
            for f in index.html deckconnector.bin; do
              b=$(size pr "$f"); a=$(size main "$f")
              [ -n "$b" ] || continue
              if [ -z "$a" ]; then echo "| $f | | $b | |"; continue; fi
              echo "| $f | $a | $b | $(awk "BEGIN { printf \"%+.1f %%\", ($b - $a) * 100 / $a }") |"
              [ $((b * 100)) -le $((a * 101)) ] || over="$over $f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$over" ] && [ "$allowed" != true ]; then
            echo "::error::more than 1 % bigger than main:$over. If that is intended, add the label size-increase and re-run this job."
            exit 1
          fi

  # The one check branch protection needs: it fails when any job above failed or was cancelled.
  ci-ok:
    needs: [changes, host-tests, lint, web, demo, sim-tests, firmware, sizes]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
