name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 5
    permissions:
      pull-requests: read # paths-filter lists the files of a pull request
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      host: ${{ steps.filter.outputs.host }}
      lint: ${{ steps.filter.outputs.lint }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # Pushes, tags and manual runs build everything; only pull requests skip by path.
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            firmware: [firmware/**, web/**, tools/dbtools/flashimage.py, .github/scripts/tidy-firmware.sh, .github/scripts/linked-libs.*, .github/workflows/ci.yml]
            host: [firmware/host_test/**, firmware/components/**, .github/workflows/ci.yml]
            lint: [tools/**, firmware/**, .github/**]
            web: [web/**, .github/workflows/ci.yml]

  host-tests:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.host == 'true'
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cmake -S firmware/host_test -B build-host -G Ninja && cmake --build build-host
      - run: ctest --test-dir build-host --output-on-failure

  lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.lint == 'true'
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # every workflow, with shellcheck on its run: blocks
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - run: cd tools && uvx ruff@0.17.4 check . && uvx ruff@0.17.4 format --check . && uv run --locked mypy
      - run: git ls-files 'firmware/components/db_*/*.c' 'firmware/components/db_*/*.h' 'firmware/components/db_*/include/*.h' 'firmware/main/*.c' 'firmware/components/db_core/drivers/*.c' 'firmware/host_test/*.c' 'firmware/components/db_*/*.cpp' | grep -v font_data.c | xargs pipx run clang-format==23.1.3 --dry-run --Werror
      - run: cmake -S firmware/host_test -B build-host -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: pipx run clang-tidy==23.1.4 -p build-host firmware/components/db_core/*.c firmware/components/db_core/drivers/*.c

  web:
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.firmware == 'true'
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # release.yml appends licenses.md to THIRD_PARTY_LICENSES.txt
      - run: cd web && npm ci && npm run check && test -s dist/licenses.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-page
          path: |
            web/dist/index.html
            web/dist/licenses.md
          if-no-files-found: error

  # The website's demo, clicked through on a desktop and a phone screen. The contract project compares its mock with
  # the firmware simulator.
  demo:
    needs: changes
    if: >-
      github.event_name != 'pull_request' || needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.firmware == 'true'
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        project: [desktop, phone, contract] # one runner each: the runner gets one Playwright worker
    env:
      IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: cd web && npm ci && npx playwright install chromium && npm run build:demo
      - if: matrix.project == 'contract'
        run: |
          (cd web && npx vite build) # the simulator embeds the page from web/dist
          docker pull -q "$IDF_IMAGE"
          # under the same path: the simulator opens its flash files at the path it was built in
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$IDF_IMAGE" bash -c '
            set -e
            git config --global --add safe.directory "$PWD"
            idf.py -C firmware/sim build
          '
      # the runners share one machine, so each takes its own ports (gh-runner-1 5192, gh-runner-2 5193)
      - run: |
          n=${RUNNER_NAME##*-}
          [ "${{ matrix.project }}" = contract ] || export DC_NO_SIM=1
          cd web && DC_DEMO_PORT=$((5191 + n)) DC_SIM_PORT=$((18230 + n)) npx playwright test -c playwright.demo.config.ts --project "${{ matrix.project }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-traces-${{ matrix.project }}
          path: web/test-results
          retention-days: 7

  # Builds its own copy of the web page, so it runs beside the web job. The ESP-IDF image (about 10 GB unpacked)
  # comes down in the background while the page builds.
  firmware:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.firmware == 'true'
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      IDF_IMAGE: espressif/idf:v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
    steps:
      - run: |
          (docker pull -q "$IDF_IMAGE"; echo $? > "$RUNNER_TEMP/pull-status") > "$RUNNER_TEMP/pull.log" 2>&1 < /dev/null &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe sets the firmware version
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: cd web && npm ci && npx vite build
      - name: Wait for the ESP-IDF image
        timeout-minutes: 8
        run: |
          until test -s "$RUNNER_TEMP/pull-status"; do sleep 1; done
          cat "$RUNNER_TEMP/pull.log"
          exit "$(cat "$RUNNER_TEMP/pull-status")"
      - name: Build
        run: |
          # CCACHE_DIR is the runner machine's ccache; a release builds from a clean slate
          cc=${CCACHE_DIR:-$RUNNER_TEMP/ccache}; [ "$GITHUB_REF_TYPE" != tag ] || cc=$RUNNER_TEMP/ccache; mkdir -p "$cc"
          # as the runner's user: files a root container leaves in the workspace break the next checkout
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:/w" -v "$cc:/ccache" -w /w -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=5G "$IDF_IMAGE" bash -c '
            set -e
            git config --global --add safe.directory /w
            idf.py -C firmware build
            cd tools && python -m dbtools.flashimage
          '
      - run: .github/scripts/linked-libs.sh
      - name: clang-tidy
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$GITHUB_WORKSPACE:/w" -w /w "$IDF_IMAGE" bash -c '
            set -e
            git config --global --add safe.directory /w
            python -m venv /tmp/tidy && /tmp/tidy/bin/pip install -q clang-tidy==23.1.4
            PATH=/tmp/tidy/bin:$PATH .github/scripts/tidy-firmware.sh
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deckconnector
          path: firmware/build/deckconnector.bin
          if-no-files-found: error
      # goes into the release: a coredump from the field decodes only with the ELF of the same build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elf
          path: firmware/build/deckconnector.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flasher
          path: firmware/build/web-flash/
          if-no-files-found: error

  # A PR may grow the web page or the firmware by 1 % at most, or it needs the label
  # size-increase (then re-run this job).
  sizes:
    needs: [web, firmware]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 5
    permissions:
      actions: read # the artifacts of main
      pull-requests: read # the label
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{web-page,deckconnector}'
          path: pr
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          main=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          for a in web-page deckconnector; do
            [ -z "$main" ] || gh run download "$main" --repo "$GITHUB_REPOSITORY" --name "$a" --dir "main/$a" || true
          done
          size() {
            f=$(find "$1" -name "$2" 2> /dev/null | head -1)
            [ -z "$f" ] || case $2 in *.html) gzip -9c "$f" | wc -c ;; *) stat -c %s "$f" ;; esac
          }
          allowed=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "size-increase")')
          over=
          {
            echo '| File | main | PR | Change |'
            echo '|---|---|---|---|'
            for f in index.html deckconnector.bin; do
              b=$(size pr "$f"); a=$(size main "$f")
              [ -n "$b" ] || continue
              if [ -z "$a" ]; then echo "| $f | | $b | |"; continue; fi
              echo "| $f | $a | $b | $(awk "BEGIN { printf \"%+.1f %%\", ($b - $a) * 100 / $a }") |"
              [ $((b * 100)) -le $((a * 101)) ] || over="$over $f"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$over" ] && [ "$allowed" != true ]; then
            echo "::error::more than 1 % bigger than main:$over. If that is intended, add the label size-increase and re-run this job."
            exit 1
          fi

  # The one check branch protection needs: it fails when any job above failed or was cancelled.
  ci-ok:
    needs: [changes, host-tests, lint, web, demo, firmware, sizes]
    if: always()
    runs-on: [self-hosted, deckconnector]
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
